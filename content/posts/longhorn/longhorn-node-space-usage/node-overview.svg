<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="340" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="38" font-size="17" font-weight="600" fill="#111827">o11y 集群三节点存储总览（Longhorn Nodes 页面实测）</text>

  <!-- 表头 -->
  <text x="30" y="78" font-size="12" font-weight="600" fill="#6b7280">节点</text>
  <text x="150" y="78" font-size="12" font-weight="600" fill="#2563eb">Allocated（逻辑调度 / 上限 100.98 Gi）</text>
  <text x="470" y="78" font-size="12" font-weight="600" fill="#ea580c">Used（真实占用 / 总 144.26 Gi）</text>
  <text x="770" y="78" font-size="12" font-weight="600" fill="#6b7280" text-anchor="end">Size</text>

  <!-- node22 -->
  <text x="30" y="112" font-size="13" font-weight="600" fill="#111827">node22</text>
  <text x="30" y="128" font-size="11" fill="#9ca3af">10.42.35.183</text>
  <rect x="150" y="100" width="240" height="26" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="150" y="100" width="71" height="26" fill="#2563eb"/>
  <text x="396" y="118" font-size="11" fill="#1e3a8a">30 / 100.98</text>
  <rect x="470" y="100" width="240" height="26" fill="#fff7ed" stroke="#fed7aa"/>
  <rect x="470" y="100" width="40" height="26" fill="#ea580c"/>
  <text x="716" y="118" font-size="11" fill="#9a3412">23.75 / 144.26</text>
  <text x="770" y="118" font-size="12" fill="#374151" text-anchor="end" opacity="0">.</text>

  <!-- node23 -->
  <text x="30" y="172" font-size="13" font-weight="600" fill="#111827">node23</text>
  <text x="30" y="188" font-size="11" fill="#9ca3af">10.42.98.73</text>
  <rect x="150" y="160" width="240" height="26" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="150" y="160" width="71" height="26" fill="#2563eb"/>
  <text x="396" y="178" font-size="11" fill="#1e3a8a">30 / 100.98</text>
  <rect x="470" y="160" width="240" height="26" fill="#fff7ed" stroke="#fed7aa"/>
  <rect x="470" y="160" width="60" height="26" fill="#ea580c"/>
  <text x="716" y="178" font-size="11" fill="#9a3412">35.76 / 144.26</text>

  <!-- node24 -->
  <text x="30" y="232" font-size="13" font-weight="600" fill="#111827">node24</text>
  <text x="30" y="248" font-size="11" fill="#9ca3af">10.42.219.104</text>
  <rect x="150" y="220" width="240" height="26" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="150" y="220" width="71" height="26" fill="#2563eb"/>
  <text x="396" y="238" font-size="11" fill="#1e3a8a">30 / 100.98</text>
  <rect x="470" y="220" width="240" height="26" fill="#fff7ed" stroke="#fed7aa"/>
  <rect x="470" y="220" width="50" height="26" fill="#ea580c"/>
  <text x="716" y="238" font-size="11" fill="#9a3412">30.29 / 144.26</text>

  <!-- Size 列统一说明 + 底注 -->
  <text x="770" y="118" font-size="12" fill="#374151" text-anchor="end">101 Gi</text>
  <text x="770" y="178" font-size="12" fill="#374151" text-anchor="end">101 Gi</text>
  <text x="770" y="238" font-size="12" fill="#374151" text-anchor="end">101 Gi</text>

  <rect x="30" y="272" width="740" height="46" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="46" y="294" font-size="12" fill="#374151">每节点 1 块盘 <tspan font-family="monospace">/var/lib/longhorn/</tspan>：Size 101 Gi（+43.3 Gi Reserved，总 144.26 Gi）。三节点 Allocated 均衡，Used 因真实写入不同而各异。</text>
  <text x="46" y="312" font-size="12" fill="#6b7280">节点级数值 = 该节点下所有 disk 的对应值求和；此处每节点仅 1 块盘，故与磁盘级一致。</text>
</svg>
