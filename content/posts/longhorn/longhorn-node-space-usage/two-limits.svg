<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="480" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="30" y="36" font-size="17" font-weight="600" fill="#111827">两个上限：为什么这块盘会变 Unschedulable</text>
  <text x="30" y="60" font-size="12" fill="#6b7280">满盘案例 cf1cb878：Storage Maximum 5913.54 Gi，Reserved 1.73 TiB，Size 4.04 TiB，超配 200%</text>

  <!-- 限制A：Allocated 超配上限 -->
  <text x="30" y="98" font-size="13" font-weight="600" fill="#2563eb">限制 A：Allocated 逻辑调度接近超配上限</text>
  <rect x="60" y="108" width="680" height="34" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="60" y="108" width="628" height="34" fill="#2563eb"/>
  <text x="360" y="130" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Allocated Used 7644.9 Gi</text>
  <text x="732" y="130" font-size="11" fill="#1e3a8a" text-anchor="end">上限 8278.97</text>
  <text x="60" y="160" font-size="12" fill="#6b7280">上限 = Size 4.04 TiB × 200% ≈ 8278.97 Gi；仅剩 8278.97 − 7644.9 ≈ 634 Gi 可再调度。</text>

  <!-- 限制B：真实可用低于 Minimal Available -->
  <text x="30" y="200" font-size="13" font-weight="600" fill="#ea580c">限制 B：真实可用空间低于 Minimal Available 下限</text>
  <rect x="60" y="210" width="680" height="34" fill="#f3f4f6" stroke="#e5e7eb"/>
  <rect x="60" y="210" width="618" height="34" fill="#ea580c"/>
  <text x="330" y="232" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Used 5374.87 Gi</text>
  <!-- 25% 必须保留区 -->
  <rect x="570" y="210" width="170" height="34" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="570" y1="200" x2="570" y2="254" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="655" y="270" font-size="11" fill="#dc2626" text-anchor="middle">必须保留 ≥1478 Gi 空闲</text>
  <text x="655" y="285" font-size="11" fill="#dc2626" text-anchor="middle">（Max × 25%）</text>
  <text x="60" y="270" font-size="12" fill="#6b7280">条底 = Storage Maximum 5913.54 Gi。</text>

  <!-- 结论 -->
  <rect x="30" y="300" width="740" height="150" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="46" y="326" font-size="13" font-weight="600" fill="#991b1b">结果：真实可用已跌破下限</text>
  <text x="46" y="352" font-size="12" fill="#374151">Available = 5913.54 − 5374.87 = <tspan font-weight="600" fill="#dc2626">538.67 Gi</tspan>，而要求至少保留 5913.54 × 25% = <tspan font-weight="600">1478.39 Gi</tspan>。</text>
  <text x="46" y="374" font-size="12" fill="#374151">538.67 Gi &lt; 1478.39 Gi → 该 disk 被标记为 <tspan font-weight="600" fill="#dc2626">Unschedulable</tspan>，即使 Allocated 还没到上限也会停止调度/扩容。</text>
  <text x="46" y="402" font-size="12" fill="#374151">这块盘同时承受两股压力：Allocated 逼近超配上限（剩 ~634 Gi）+ 真实 Used 太高（可用仅 538 Gi）。</text>
  <text x="46" y="428" font-size="12" fill="#6b7280">扩容检查是针对 replica <tspan font-weight="600">当前所在 disk</tspan> 做的，所以别的盘还空，这块盘上的 replica 扩容仍会失败。</text>
</svg>
